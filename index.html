<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD INNOVATION</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: #050505 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Overlay oscuro para legibilidad */
        .overlay {
            background: rgba(5, 5, 5, 0.85);
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-bottom: 30px;
        }

        /* Selector de Idioma */
        .language-selector {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
        }
        .language-selector select {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            outline: none;
            transition: all 0.3s ease;
        }
        .language-selector select:hover {
            background: rgba(0, 255, 255, 0.3);
        }

        /* Contenedor Superior (Iconos / Redes redondas) */
        .top-icons-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 15px 0;
            flex-wrap: wrap;
            max-width: 90%;
        }
        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            overflow: hidden;
            background: #111;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }
        .icon-circle:hover {
            transform: scale(1.1);
        }
        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Carrusel de Imágenes corregido */
        .carousel-container {
            width: 90%;
            max-width: 420px;
            margin: 10px auto;
            overflow: hidden;
            border: 2px solid #00ffff;
            border-radius: 12px;
            background: #111;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            position: relative;
        }
        .carousel-slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }
        .carousel-slide-item {
            min-width: 100%;
            box-sizing: border-box;
        }
        .carousel-slides img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Banner central decorativo */
        .central-banner {
            width: 90%;
            max-width: 420px;
            margin: 15px auto;
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .central-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Círculo NFT Central */
        .nft-badge-container {
            margin: 10px auto;
        }
        .nft-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
        }
        .nft-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botones del menú principal (Grid) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 420px;
            margin: 15px auto;
        }
        .menu-btn {
            background: linear-gradient(135deg, rgba(0, 68, 102, 0.8), rgba(0, 34, 51, 0.9));
            border: 2px solid #00ffff;
            color: #ffffff;
            padding: 14px 5px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover {
            background: #00ffff;
            color: #000000;
            box-shadow: 0 0 15px #00ffff;
            transform: translateY(-2px);
        }

        /* Pie de página */
        .footer-brand {
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 2px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="overlay">
        <!-- Selector de Idioma -->
        <div class="language-selector">
            <select id="langSwitch" onchange="changeLanguage()">
                <option value="es">🇪🇸 ES</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>

        <!-- Iconos Superiores (Asegúrate de cambiar las URLs por tus imágenes locales o enlaces válidos) -->
        <div class="top-icons-container">
            <div class="icon-circle"><img src="token1.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
            <div class="icon-circle"><img src="token2.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
            <div class="icon-circle"><img src="token3.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
            <div class="icon-circle"><img src="token4.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
            <div class="icon-circle"><img src="token5.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
            <div class="icon-circle"><img src="token6.png" alt="Token" onerror="this.src='https://via.placeholder.com/50/111/00ffff?text=Z'"></div>
        </div>

        <!-- Carrusel con imágenes protegidas contra errores (rutas corregidas) -->
        <div class="carousel-container">
            <div class="carousel-slides" id="slider">
                <div class="carousel-slide-item">
                    <img src="banner-carrusel-1.jpg" alt="Carrusel 1" onerror="this.src='https://via.placeholder.com/420x200/111/00ffff?text=ZAARD+INNOVATION+1'">
                </div>
                <div class="carousel-slide-item">
                    <img src="banner-carrusel-2.jpg" alt="Carrusel 2" onerror="this.src='https://via.placeholder.com/420x200/111/00ffff?text=ZAARD+INNOVATION+2'">
                </div>
            </div>
        </div>

        <!-- Banner Central (Renacimiento) -->
        <div class="central-banner">
            <img src="banner-renacimiento.jpg" alt="Renacimiento" onerror="this.src='https://via.placeholder.com/420x100/111/00ffff?text=RENACIMIENTO'">
        </div>

        <!-- Insignia NFT Central -->
        <div class="nft-badge-container">
            <div class="nft-circle">
                <img src="nft-logo.jpg" alt="NFT" onerror="this.src='https://via.placeholder.com/70/111/00ffff?text=NFT'">
            </div>
        </div>

        <!-- Menú de Botones Principales con soporte multi-idioma -->
        <div class="menu-grid">
            <a href="#" class="menu-btn" data-es="MÚSICA" data-en="MUSIC">MÚSICA</a>
            <a href="#" class="menu-btn" data-es="DEPORTES" data-en="SPORTS">DEPORTES</a>
            <a href="#" class="menu-btn" data-es="WEB3" data-en="WEB3">WEB3</a>
            <a href="#" class="menu-btn" data-es="X (TWITTER)" data-en="X (TWITTER)">X (TWITTER)</a>
            <a href="#" class="menu-btn" data-es="ZAARD WEB" data-en="ZAARD WEB">ZAARD WEB</a>
            <a href="#" class="menu-btn" data-es="DISCORD" data-en="DISCORD">DISCORD</a>
        </div>

        <!-- Pie de página -->
        <div class="footer-brand">ZAARD_ALX</div>
    </div>

    <script>
        // Función para cambiar los textos del menú según el idioma seleccionado
        function changeLanguage() {
            const lang = document.getElementById('langSwitch').value;
            const buttons = document.querySelectorAll('.menu-btn');
            
            buttons.forEach(btn => {
                if (lang === 'en') {
                    btn.textContent = btn.getAttribute('data-en');
                } else {
                    btn.textContent = btn.getAttribute('data-es');
                }
            });
        }

        // Lógica automática del carrusel para rotar las imágenes sin que se rompan
        let currentIndex = 0;
        function slideCarousel() {
            const slider = document.getElementById('slider');
            const totalSlides = slider.children.length;
            currentIndex = (currentIndex + 1) % totalSlides;
            slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
        
        // Cambia de imagen cada 4 segundos automáticamente
        setInterval(slideCarousel, 4000);
    </script>

</body>
</html>
