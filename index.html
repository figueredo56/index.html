<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAARD INNOVATION - Ecosistema</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Rajdhani', sans-serif;
            background-color: #05050a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- PANTALLA DE INTRODUCCIÓN (EFECTO VISUAL) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0b2e 0%, #05050a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        #intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .intro-logo {
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
            animation: zoomInLogo 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .intro-title {
            margin-top: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: #f39c12;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
            opacity: 0;
            animation: fadeInText 1s ease 0.8s forwards;
        }

        /* --- PANTALLA PRINCIPAL DE BIENVENIDA --- */
        #welcome-screen {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #0b0914 0%, #150e28 50%, #05050a 100%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
        }

        #welcome-screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* Barra Superior (Selector de Idiomas) */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            max-width: 1200px;
            z-index: 10;
        }

        .language-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #f39c12;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .language-selector option {
            background: #111;
            color: #fff;
        }

        .language-selector:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
        }

        /* Contenido Central con Carrusel */
        .welcome-content {
            text-align: center;
            max-width: 900px;
            margin: auto;
            width: 100%;
        }

        .welcome-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            color: #ffffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .welcome-title span {
            color: #f39c12;
        }

        .welcome-message {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #cfd8dc;
            margin-bottom: 25px;
            padding: 0 15px;
        }

        /* --- ESTILOS DEL CARRUSEL --- */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            height: 320px;
            margin: 0 auto 30px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(243, 156, 18, 0.4);
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.25);
            background: rgba(0, 0, 0, 0.5);
        }

        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Botones de navegación del carrusel */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #f39c12;
            color: #f39c12;
            font-size: 1.5rem;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
            z-index: 10;
        }

        .carousel-btn:hover {
            background: #f39c12;
            color: #05050a;
            box-shadow: 0 0 15px #f39c12;
        }

        .carousel-btn.prev { left: 15px; }
        .carousel-btn.next { right: 15px; }

        /* Indicadores (puntos) del carrusel */
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
        }

        .indicator.active {
            background: #f39c12;
            box-shadow: 0 0 10px #f39c12;
            transform: scale(1.2);
        }

        /* Botón Hacia el Ecosistema */
        .ecosystem-btn {
            display: inline-block;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            color: #05050a;
            background: linear-gradient(45deg, #f39c12, #f1c40f);
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.6);
            transition: all 0.3s ease;
        }

        .ecosystem-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 35px rgba(243, 156, 18, 0.9);
            background: linear-gradient(45deg, #f1c40f, #f39c12);
        }

        /* Pie de página sutil */
        .footer-note {
            font-size: 0.85rem;
            color: #7f8c8d;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            margin-top: 20px;
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes zoomInLogo {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        [dir="rtl"] {
            direction: rtl;
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INTRODUCCIÓN (EFECTO VISUAL CON IMAGEN OFICIAL) -->
    <div id="intro-screen">
        <img src="https://photos.pinksale.finance/file/pinksale-logo-upload/1790285851823-4955b8f5511ea8235af22dfb82371c91.png" alt="Zaard Logo" class="intro-logo">
        <div class="intro-title">Zaard Innovation</div>
    </div>

    <!-- 2. PANTALLA PRINCIPAL DE BIENVENIDA -->
    <div id="welcome-screen">
        <!-- Selector de Idiomas -->
        <div class="top-bar">
            <select id="langSelect" class="language-selector" onchange="changeLanguage(this.value)">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇬🇧 English</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
        </div>

        <!-- Contenido Central y Carrusel -->
        <div class="welcome-content">
            <h1 class="welcome-title" id="welcome-heading">Bienvenido a <span>Zaard</span></h1>
            <p class="welcome-message" id="welcome-text">
                El futuro descentralizado del Web3 en la BNB Smart Chain. Explora nuestro ecosistema de alto rendimiento, juegos interactivos, herramientas financieras y staking avanzado.
            </p>

            <!-- CARRUSEL VISUAL -->
            <div class="carousel-container">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Slide 1: Imagen oficial de PinkSale -->
                    <div class="carousel-slide">
                        <img src="https://photos.pinksale.finance/file/pinksale-logo-upload/1790285851823-4955b8f5511ea8235af22dfb82371c91.png" alt="Zaard Innovation Logo">
                    </div>
                    <!-- Slide 2: Banner o Ecosistema -->
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1639762681485-074b7f938ba0?q=80&w=1000&auto=format&fit=crop" alt="Web3 Ecosystem">
                    </div>
                    <!-- Slide 3: Gaming y Staking -->
                    <div class="carousel-slide">
                        <img src="https://images.unsplash.com/photo-1642104704074-907c0698cbd9?q=80&w=1000&auto=format&fit=crop" alt="Blockchain Tech">
                    </div>
                </div>
                <!-- Controles -->
                <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
                <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
                <!-- Indicadores -->
                <div class="carousel-indicators" id="carouselIndicators">
                    <span class="indicator active" onclick="currentSlide(0)"></span>
                    <span class="indicator" onclick="currentSlide(1)"></span>
                    <span class="indicator" onclick="currentSlide(2)"></span>
                </div>
            </div>

            <!-- Botón al Ecosistema -->
            <a href="ecosistema.html" class="ecosystem-btn" id="ecosystem-btn-text">Ir al Ecosistema</a>
        </div>

        <!-- Nota al pie -->
        <div class="footer-note" id="footer-text">
            © 2026 ZAARD INNOVATION. Todos los derechos reservados.
        </div>
    </div>

    <script>
        // Lógica del Carrusel
        let currentIndex = 0;
        const track = document.getElementById('carouselTrack');
        const slides = document.querySelectorAll('.carousel-slide');
        const indicators = document.querySelectorAll('.indicator');

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            indicators.forEach((ind, index) => {
                ind.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            } else if (currentIndex >= slides.length) {
                currentIndex = 0;
            }
            updateCarousel();
        }

        function currentSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        // Auto-play del carrusel cada 4 segundos
        setInterval(() => {
            moveSlide(1);
        }, 4000);

        // Diccionario de Traducciones Multi-idioma
        const translations = {
            es: {
                heading: "Bienvenido a <span>Zaard</span>",
                text: "El futuro descentralizado del Web3 en la BNB Smart Chain. Explora nuestro ecosistema de alto rendimiento, juegos interactivos, herramientas financieras y staking avanzado.",
                btn: "Ir al Ecosistema",
                footer: "© 2026 ZAARD INNOVATION. Todos los derechos reservados.",
                dir: "ltr"
            },
            en: {
                heading: "Welcome to <span>Zaard</span>",
                text: "The decentralized future of Web3 on the BNB Smart Chain. Explore our high-performance ecosystem, interactive gaming, financial tools, and advanced staking.",
                btn: "Go to Ecosystem",
                footer: "© 2026 ZAARD INNOVATION. All rights reserved.",
                dir: "ltr"
            },
            ar: {
                heading: "<span>Zaard</span> مرحباً بك في",
                text: "المستقبل اللامركزي لـ Web3 على شبكة BNB Smart Chain. استكشف نظامنا البيئي عالي الأداء، والألعاب التفاعلية، والأدوات المالية.",
                btn: "الانتقال إلى النظام البيئي",
                footer: "© 2026 ZAARD INNOVATION. جميع الحقوق محفوظة.",
                dir: "rtl"
            },
            zh: {
                heading: "欢迎来到 <span>Zaard</span>",
                text: "BNB Smart Chain 上 Web3 的去中心化未来。探索我们的高性能生态系统、互动游戏、金融工具和高级质押服务。",
                btn: "进入生态系统",
                footer: "© 2026 ZAARD INNOVATION. 版权所有。",
                dir: "ltr"
            }
        };

        function changeLanguage(lang) {
            const data = translations[lang];
            document.getElementById('welcome-heading').innerHTML = data.heading;
            document.getElementById('welcome-text').innerText = data.text;
            document.getElementById('ecosystem-btn-text').innerText = data.btn;
            document.getElementById('footer-text').innerText = data.footer;
            document.body.setAttribute('dir', data.dir);
        }

        // Transición de la pantalla de introducción a la bienvenida
        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-screen');
                const welcome = document.getElementById('welcome-screen');
                
                intro.classList.add('fade-out');
                welcome.classList.add('active');
            }, 2800);
        });
    </script>
</body>
</html>
