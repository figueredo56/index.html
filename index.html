<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECOSISTEMA ZAARD</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; text-align: center; color: white; 
               background: #050014; /* Fondo oscuro sólido para carga rápida */
               display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .main-container { width: 100%; max-width: 400px; padding: 10px; }

        /* Botones Circulares Mejorados */
        .btn-circle { 
            width: 60px; height: 60px; border-radius: 50%; 
            border: 2px solid #00ffcc; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; background: #000;
        }
        .btn-circle img { width: 100%; height: 100%; object-fit: cover; }

        .btn { border: 2px solid #00ffcc; padding: 8px; text-decoration: none; border-radius: 8px; 
               font-size: 0.7em; color: #00ffcc; background: rgba(0,0,0,0.6); display: block; margin: 5px; }

        .blink-green { color: #00ff00; font-weight: bold; font-size: 0.65em; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Video embebido ajustado -->
        <div style="width: 100%; height: 180px; border: 2px solid #00ffcc; border-radius: 10px; overflow: hidden; margin-bottom: 15px;">
            <iframe src="https://www.youtube.com/embed/3ZLhfmZWLXk" style="width:100%; height:100%; border:none;"></iframe>
        </div>

        <!-- Fila de Botones Circulares -->
        <div style="display: flex; justify-content: space-around; width: 100%; margin-bottom: 20px;">
            <div style="display:flex; flex-direction:column; align-items:center;">
                <a href="https://app.binance.com/uni-qr/web3-token-details?utm_medium=share&tokenCA=0x5cac292558049638f39fb492e70fdbf3c4f5eb4e&binanceChainId=56&chain=bsc" class="btn-circle">
                    <img src="https://raw.githubusercontent.com/figueredo56/ZAARD.token/main/logo.png" onerror="this.src='https://via.placeholder.com/60'">
                </a>
                <span class="blink-green">ZARD</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <a href="#" class="btn-circle">
                    <img src="https://raw.githubusercontent.com/figueredo56/ZAARD.token/main/panga.png" onerror="this.src='https://via.placeholder.com/60'">
                </a>
                <span class="blink-green">PANGA</span>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <a href="#" class="btn-circle">
                    <img src="https://raw.githubusercontent.com/figueredo56/ZAARD.token/main/zared.png" onerror="this.src='https://via.placeholder.com/60'">
                </a>
                <span class="blink-green">ZARED</span>
            </div>
        </div>

        <!-- Botón Grande -->
        <a href="https://pancakeswap.finance/swap?outputCurrency=0x5cac292558049638f39fb492e70fdbf3c4f5eb4e" 
           style="display:block; width: 100%; height: 50px; background: #22c55e; color: white; line-height: 50px; text-decoration: none; border-radius: 10px; font-weight: bold; margin-bottom: 15px;">
           SWAP EN PANCAKESWAP
        </a>

        <!-- Grid de botones -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <a href="https://open.spotify.com/playlist/2WoPMH4aMnQ0IsHx0yPZFk" class="btn">MÚSICA</a>
            <a href="https://www.youtube.com/live/iZqU70-LizY" class="btn">DEPORTES</a>
            <a href="https://share.google/kFlBcNnLr7SvJ8QRF" class="btn">WEB3</a>
            <a href="https://figueredo56.github.io/ZAARD-Arcade/index-menu.html" class="btn">ARCADE</a>
            <a href="https://figueredo56.github.io/zaard-official/" class="btn">WEB</a>
            <a href="https://discord.gg/rRxNpNXdj" class="btn">DISCORD</a>
        </div>
    </div>
</body>
</html>
